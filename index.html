<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS Pro - Enterprise Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="app-container" id="appContainer" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-users-gear"></i>
                <span>HRIS Pro</span>
            </div>
            <ul class="sidebar-menu">
                <li class="active" data-module="dashboard"><a href="#"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li data-module="employees"><a href="#"><i class="fa-solid fa-user-group"></i> Karyawan (Core HR)</a></li>
                <li data-module="organization"><a href="#"><i class="fa-solid fa-sitemap"></i> Organisasi</a></li>
                <li data-module="attendance"><a href="#"><i class="fa-solid fa-calendar-check"></i> Kehadiran</a></li>
                <li data-module="leave"><a href="#"><i class="fa-solid fa-person-walking-luggage"></i> Cuti & Izin</a></li>
                <li data-module="approval"><a href="#"><i class="fa-solid fa-list-check"></i> Pusat Approval</a></li>
                <li data-module="analytics"><a href="#"><i class="fa-solid fa-chart-pie"></i> Analitik & Laporan</a></li>
                <li data-module="settings"><a href="#"><i class="fa-solid fa-gear"></i> Pengaturan & Akses</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="navbar-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Cari data karyawan, departemen...">
                </div>
                <div class="navbar-profile">
                    <div class="notification-icon" title="Notifikasi Sistem">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="profile-info">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Admin HR">
                        <div>
                            <h4>John Due</h4>
                            <p>HR Administrator</p>
                        </div>
                    </div>
                    <button id="btnLogout" class="btn-logout" title="Keluar Sistem"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </header>

            <div class="dashboard-body" id="moduleView"></div>
        </main>
    </div>

    <div id="authContainer" class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 28px;">
                <i class="fa-solid fa-users-gear" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 12px;"></i>
                <h2 style="font-size: 1.5rem; font-weight: 700;">HRIS Pro Admin</h2>
                <p style="color: var(--gray-text); font-size: 0.85rem; margin-top: 4px;">Enterprise Human Resource Information System</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email / Username</label>
                    <input type="text" class="form-control" value="admin@hrispro.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div style="position: relative;">
                        <input type="password" id="passwordInput" class="form-control" value="password123" required style="padding-right: 40px;">
                        <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--gray-text);"></i>
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
                    <label style="color: var(--gray-text);"><input type="checkbox" checked style="margin-right: 6px;"> Remember Me</label>
                    <a href="#" onclick="alert('Fitur reset password simulasi.')" style="color: var(--primary); text-decoration: none; font-weight: 500;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary">Sign In to Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // INISIALISASI KLIEN DATABASE (MENGHINDARI KONFLIK NAMA)
        // ==========================================
        let dbClient = null;
        try {
            const SUPABASE_URL = 'https://rykepptnfqftcwpdjpqd.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_burXWke6kJSJxourw9nixQ_iboSIbYi';
            if (window.supabase) {
                dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.error('Inisialisasi Supabase gagal:', err);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                
                const currentModule = sessionStorage.getItem('activeModule') || 'dashboard';
                loadModule(currentModule);

                document.querySelectorAll('.sidebar-menu li').forEach(i => {
                    if (i.getAttribute('data-module') === currentModule) {
                        i.classList.add('active');
                    } else {
                        i.classList.remove('active');
                    }
                });
            }
        });

        async function loadModule(moduleName) {
            const view = document.getElementById('moduleView');
            try {
                const response = await fetch(`modules/${moduleName}.html`);
                if (!response.ok) throw new Error('Modul tidak ditemukan');
                view.innerHTML = await response.text();

                if (moduleName === 'organization') {
                    fetchDepartmentsFromSupabase();
                } else if (moduleName === 'organization-add') {
                    initOrganizationAdd();
                }
            } catch (error) {
                view.innerHTML = `<div class="card"><h3>Gagal memuat modul</h3><p>${error.message}</p></div>`;
            }
        }

        document.addEventListener('click', function(e) {
            const sidebarItem = e.target.closest('.sidebar-menu li');
            if (sidebarItem) {
                e.preventDefault();
                document.querySelectorAll('.sidebar-menu li').forEach(i => i.classList.remove('active'));
                sidebarItem.classList.add('active');
                
                const moduleName = sidebarItem.getAttribute('data-module');
                loadModule(moduleName);
                sessionStorage.setItem('activeModule', moduleName);
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('activeModule', 'dashboard');
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            loadModule('dashboard');
        }

        document.addEventListener('click', function(e) {
            if (e.target && (e.target.id === 'btnLogout' || e.target.closest('#btnLogout'))) {
                sessionStorage.removeItem('isLoggedIn');
                sessionStorage.removeItem('activeModule');
                document.getElementById('appContainer').style.display = 'none';
                document.getElementById('authContainer').style.display = 'flex';
            }
        });

        document.addEventListener('click', function(e) {
            const toggleBtn = e.target.closest('#togglePassword');
            if (toggleBtn) {
                const passwordInput = document.getElementById('passwordInput');
                if (passwordInput) {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    toggleBtn.classList.toggle('fa-eye');
                    toggleBtn.classList.toggle('fa-eye-slash');
                }
            }
        });

        document.addEventListener('input', function(e) {
            if (!e.target) return;
            if (e.target.id === 'inputNik' || e.target.id === 'inputTelp' || e.target.id === 'inputDaruratTelp') {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            }
            if (e.target.id === 'inputDaruratNama') {
                e.target.value = e.target.value.replace(/[0-9]/g, '');
            }
            if (e.target.id === 'inputTahunMasuk') {
                e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
            }
            if (e.target.id === 'inputIpk') {
                let val = parseFloat(e.target.value);
                if (val > 4) e.target.value = '4';
                if (val < 0) e.target.value = '0';
            }
        });

        document.addEventListener('change', function(e) {
            if (!e.target) return;
            if (e.target.id === 'inputJenisKontrak') {
                const endDateContainer = document.getElementById('endDateContainer');
                const inputEndDate = document.getElementById('inputEndDate');
                const inputJoinDate = document.getElementById('inputJoinDate');
                const jenisKontrak = e.target.value;

                if (jenisKontrak === 'Kontrak' || jenisKontrak === 'Probation') {
                    if (endDateContainer) endDateContainer.style.display = 'grid';
                    if (inputEndDate) {
                        inputEndDate.required = true;
                        if (inputJoinDate && inputJoinDate.value) {
                            inputEndDate.min = inputJoinDate.value;
                        }
                    }
                } else {
                    if (endDateContainer) endDateContainer.style.display = 'none';
                    if (inputEndDate) {
                        inputEndDate.required = false;
                        inputEndDate.value = '';
                        inputEndDate.removeAttribute('min');
                    }
                }
            }

            if (e.target.id === 'inputJoinDate') {
                const inputEndDate = document.getElementById('inputEndDate');
                if (inputEndDate && e.target.value) {
                    inputEndDate.min = e.target.value;
                    if (inputEndDate.value && inputEndDate.value < e.target.value) {
                        inputEndDate.value = '';
                    }
                }
            }
        });

        document.addEventListener('submit', function(e) {
            if (e.target && e.target.id === 'formAddEmployee') {
                e.preventDefault();
                const inputNik = document.getElementById('inputNik');
                const inputTelp = document.getElementById('inputTelp');
                const inputDaruratTelp = document.getElementById('inputDaruratTelp');
                const inputJenisKontrak = document.getElementById('inputJenisKontrak');
                const inputEndDate = document.getElementById('inputEndDate');
                const inputJoinDate = document.getElementById('inputJoinDate');
                const inputIpk = document.getElementById('inputIpk');

                if (inputNik && inputNik.value.length !== 16) {
                    alert('NIK wajib diisi tepat 16 digit angka.');
                    inputNik.focus();
                    return;
                }

                if (inputTelp && (inputTelp.value.length < 10 || inputTelp.value.length > 13)) {
                    alert('Nomor Telepon / WhatsApp wajib diisi antara 10 hingga 13 digit.');
                    inputTelp.focus();
                    return;
                }

                if (inputDaruratTelp && (inputDaruratTelp.value.length < 10 || inputDaruratTelp.value.length > 13)) {
                    alert('Nomor Telepon Kontak Darurat wajib diisi antara 10 hingga 13 digit.');
                    inputDaruratTelp.focus();
                    return;
                }

                if (inputJenisKontrak && (inputJenisKontrak.value === 'Kontrak' || inputJenisKontrak.value === 'Probation')) {
                    if (inputEndDate && !inputEndDate.value) {
                        alert('Tanggal Berakhir (End Date) wajib diisi untuk jenis kontrak Kontrak atau Probation.');
                        inputEndDate.focus();
                        return;
                    }

                    if (inputJoinDate && inputEndDate && inputJoinDate.value && inputEndDate.value < inputJoinDate.value) {
                        alert('Tanggal Berakhir (End Date) tidak boleh lebih awal dari Tanggal Bergabung (Join Date).');
                        inputEndDate.focus();
                        return;
                    }
                }

                if (inputIpk && inputIpk.value !== '') {
                    const ipk = parseFloat(inputIpk.value);
                    if (isNaN(ipk) || ipk < 0 || ipk > 4) {
                        alert('IPK wajib diisi dengan nilai antara 0.00 hingga 4.00.');
                        inputIpk.focus();
                        return;
                    }
                }

                alert('Simpan data karyawan berhasil!');
                loadModule('employees');
            }
        });

        async function fetchDepartmentsFromSupabase() {
            const tbody = document.getElementById('departmentTableBody');
            if (!tbody) return;

            if (!dbClient) {
                tbody.innerHTML = `<tr><td colspan="4" style="padding: 24px; text-align: center; color: #ef4444;">Klien database belum terinisialisasi.</td></tr>`;
                return;
            }

            const { data, error } = await dbClient
                .from('departments')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" style="padding: 24px; text-align: center; color: #ef4444;">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="padding: 24px; text-align: center; color: #64748b;">Belum ada data departemen. Silakan tambahkan baru.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(dept => {
                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 14px 20px; font-weight: 600; color: #1e293b;">${dept.kode}</td>
                        <td style="padding: 14px 20px; color: #334155;">${dept.nama}</td>
                        <td style="padding: 14px 20px; color: #64748b;">${dept.hod || '-'}</td>
                        <td style="padding: 14px 20px;">
                            <span style="padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: ${dept.status === 'Aktif' ? '#dcfce7; color: #15803d;' : '#f1f5f9; color: #475569;'}">${dept.status}</span>
                        </td>
                    </tr>
                `;
            });
        }

        async function initOrganizationAdd() {
            const inputKodeDept = document.getElementById('inputKodeDept');
            if (!inputKodeDept) return;

            let generatedCode = 'DEP-001';
            if (dbClient) {
                const { data } = await dbClient
                    .from('departments')
                    .select('kode')
                    .order('id', { ascending: false })
                    .limit(1);

                let nextNumber = 1;
                if (data && data.length > 0) {
                    let lastCode = data[0].kode;
                    let parts = lastCode.split('-');
                    let num = parts.length > 1 ? parseInt(parts[1], 10) : 0;
                    if (!isNaN(num)) nextNumber = num + 1;
                }
                generatedCode = 'DEP-' + String(nextNumber).padStart(3, '0');
            }
            inputKodeDept.value = generatedCode;

            const formAddDept = document.getElementById('formAddDepartment');
            if (formAddDept) {
                formAddDept.onsubmit = async function(e) {
                    e.preventDefault();

                    const namaVal = document.getElementById('inputNamaDept').value.trim();
                    const hodVal = document.getElementById('inputHodDept').value.trim();
                    const statusVal = document.getElementById('inputStatusDept').value;

                    if (!namaVal) {
                        alert('Nama departemen wajib diisi.');
                        document.getElementById('inputNamaDept').focus();
                        return;
                    }

                    const { data: checkExisting } = await dbClient
                        .from('departments')
                        .select('kode')
                        .eq('kode', generatedCode);

                    if (checkExisting && checkExisting.length > 0) {
                        alert('Peringatan: Kode departemen ' + generatedCode + ' baru saja digunakan oleh transaksi lain. Sistem akan memuat ulang.');
                        loadModule('organization');
                        return;
                    }

                    const { error: insertError } = await dbClient
                        .from('departments')
                        .insert([
                            { kode: generatedCode, nama: namaVal, hod: hodVal || null, status: statusVal }
                        ]);

                    if (insertError) {
                        if (insertError.code === '23505') {
                            alert('Peringatan: Kode departemen ' + generatedCode + ' sudah tersimpan oleh transaksi lain.');
                        } else {
                            alert('Gagal menyimpan data: ' + insertError.message);
                        }
                        loadModule('organization');
                        return;
                    }

                    alert('Departemen ' + namaVal + ' (' + generatedCode + ') berhasil disimpan!');
                    loadModule('organization');
                };
            }
        }
    </script>
</body>
</html>
