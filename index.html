<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS Pro - Enterprise Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- APLIKASI UTAMA (DITAMPILKAN SETELAH LOGIN) -->
    <div class="app-container" id="appContainer" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-users-gear"></i>
                <span>HRIS Pro</span>
            </div>
            <ul class="sidebar-menu">
                <li class="active" data-module="dashboard"><a href="#"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li data-module="employees"><a href="#"><i class="fa-solid fa-user-group"></i> Karyawan (Core HR)</a></li>
                <li data-module="organization"><a href="#"><i class="fa-solid fa-sitemap"></i> Organisasi</a></li>
                <li data-module="attendance"><a href="#"><i class="fa-solid fa-calendar-check"></i> Kehadiran</a></li>
                <li data-module="overtime"><a href="#"><i class="fa-solid fa-business-time"></i> Lembur (Overtime)</a></li>
                <li data-module="leave"><a href="#"><i class="fa-solid fa-person-walking-luggage"></i> Cuti & Izin</a></li>
                <li data-module="approval"><a href="#"><i class="fa-solid fa-list-check"></i> Pusat Approval</a></li>
                <li data-module="analytics"><a href="#"><i class="fa-solid fa-chart-pie"></i> Analitik & Laporan</a></li>
                <li data-module="settings"><a href="#"><i class="fa-solid fa-gear"></i> Pengaturan & Akses</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div style="flex: 1;"></div>
                <div class="navbar-profile">
                    <div class="notification-icon" title="Notifikasi Sistem">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="profile-info">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Admin HR">
                        <div>
                            <h4>John Due</h4>
                            <p>HR Administrator</p>
                        </div>
                    </div>
                    <button id="btnLogout" class="btn-logout" title="Keluar Sistem"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </header>

            <div class="dashboard-body" id="moduleView"></div>
        </main>
    </div>

    <!-- HALAMAN LOGIN -->
    <div id="authContainer" class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 28px;">
                <i class="fa-solid fa-users-gear" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 12px;"></i>
                <h2 style="font-size: 1.5rem; font-weight: 700;">HRIS Pro Admin</h2>
                <p style="color: var(--gray-text); font-size: 0.85rem; margin-top: 4px;">Enterprise Human Resource Information System</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email / Username</label>
                    <input type="text" class="form-control" value="admin@hrispro.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div style="position: relative;">
                        <input type="password" id="passwordInput" class="form-control" value="password123" required style="padding-right: 40px;">
                        <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--gray-text);"></i>
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
                    <label style="color: var(--gray-text);"><input type="checkbox" checked style="margin-right: 6px;"> Remember Me</label>
                    <a href="#" onclick="alert('Fitur reset password simulasi.')" style="color: var(--primary); text-decoration: none; font-weight: 500;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary">Sign In to Dashboard</button>
            </form>
        </div>
    </div>

    <!-- SKRIP UTAMA APLIKASI -->
    <script>
        // ==========================================
        // 1. INISIALISASI SUPABASE & GLOBAL CACHE
        // ==========================================
        let dbClient = null;
        let allEmployeesCache = [];

        try {
            const SUPABASE_URL = 'https://rykepptnfqftcwpdjpqd.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_burXWke6kJSJxourw9nixQ_iboSIbYi';
            if (window.supabase) {
                dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.error('Inisialisasi Supabase gagal:', err);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                
                const currentModule = sessionStorage.getItem('activeModule') || 'dashboard';
                loadModule(currentModule);

                document.querySelectorAll('.sidebar-menu li').forEach(i => {
                    if (i.getAttribute('data-module') === currentModule) {
                        i.classList.add('active');
                    } else {
                        i.classList.remove('active');
                    }
                });
            }
        });

        // ==========================================
        // 2. MODUL LOADER & NAVIGASI SIDEBAR
        // ==========================================
        async function loadModule(moduleName) {
            const view = document.getElementById('moduleView');
            try {
                const response = await fetch(`modules/${moduleName}.html`);
                if (!response.ok) throw new Error('Modul tidak ditemukan');
                view.innerHTML = await response.text();

                if (moduleName === 'organization') {
                    fetchDepartmentsFromSupabase();
                } else if (moduleName === 'organization-add') {
                    initOrganizationAdd();
                } else if (moduleName === 'employees') {
                    fetchEmployeesFromSupabase();
                } else if (moduleName === 'employee-add') {
                    initEmployeeAdd();
                } else if (moduleName === 'employee-edit') {
                    initEmployeeEdit();
                } else if (moduleName === 'attendance') {
                    initAttendanceModule();
                } else if (moduleName === 'overtime') {
                    initOvertimeModule();
                } else if (moduleName === 'leave') {
                    initLeaveModule();
                } else if (moduleName === 'leave-add') {
                    initLeaveAddModule();
                } else if (moduleName === 'dashboard') {
                    initDashboard();
                }
            } catch (error) {
                view.innerHTML = `<div class="card"><h3>Gagal memuat modul</h3><p>${error.message}</p></div>`;
            }
        }

        document.addEventListener('click', function(e) {
            const sidebarItem = e.target.closest('.sidebar-menu li');
            if (sidebarItem) {
                e.preventDefault();
                document.querySelectorAll('.sidebar-menu li').forEach(i => i.classList.remove('active'));
                sidebarItem.classList.add('active');
                
                const moduleName = sidebarItem.getAttribute('data-module');
                loadModule(moduleName);
                sessionStorage.setItem('activeModule', moduleName);
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('activeModule', 'dashboard');
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            loadModule('dashboard');
        }

        document.addEventListener('click', function(e) {
            if (e.target && (e.target.id === 'btnLogout' || e.target.closest('#btnLogout'))) {
                sessionStorage.removeItem('isLoggedIn');
                sessionStorage.removeItem('activeModule');
                document.getElementById('appContainer').style.display = 'none';
                document.getElementById('authContainer').style.display = 'flex';
            }
        });

        document.addEventListener('click', function(e) {
            const toggleBtn = e.target.closest('#togglePassword');
            if (toggleBtn) {
                const passwordInput = document.getElementById('passwordInput');
                if (passwordInput) {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    toggleBtn.classList.toggle('fa-eye');
                    toggleBtn.classList.toggle('fa-eye-slash');
                }
            }
        });

        // ==========================================
        // 3. VALIDASI INPUT OTOMATIS & FORMAT
        // ==========================================
        document.addEventListener('input', function(e) {
            if (!e.target) return;
            if (e.target.id === 'inputNik' || e.target.id === 'editNik' || e.target.id === 'inputTelp' || e.target.id === 'editTelp' || e.target.id === 'inputDaruratTelp' || e.target.id === 'editDaruratTelp') {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            }
            if (e.target.id === 'inputDaruratNama' || e.target.id === 'editDaruratNama') {
                e.target.value = e.target.value.replace(/[0-9]/g, '');
            }
            if (e.target.id === 'inputTahunMasuk' || e.target.id === 'editTahunMasuk') {
                e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
            }
            if (e.target.id === 'inputIpk' || e.target.id === 'editIpk') {
                let val = parseFloat(e.target.value);
                if (val > 4) e.target.value = '4';
                if (val < 0) e.target.value = '0';
            }
        });

        document.addEventListener('change', function(e) {
            if (!e.target) return;
            if (e.target.id === 'inputJenisKontrak' || e.target.id === 'editJenisKontrak') {
                const isEdit = e.target.id.startsWith('edit');
                const endDateContainer = document.getElementById(isEdit ? 'editEndDateContainer' : 'endDateContainer');
                const inputEndDate = document.getElementById(isEdit ? 'editEndDate' : 'inputEndDate');
                const jenisKontrak = e.target.value;

                if (jenisKontrak === 'Kontrak' || jenisKontrak === 'Probation') {
                    if (endDateContainer) endDateContainer.style.display = 'grid';
                    if (inputEndDate) inputEndDate.required = true;
                } else {
                    if (endDateContainer) endDateContainer.style.display = 'none';
                    if (inputEndDate) {
                        inputEndDate.required = false;
                        inputEndDate.value = '';
                    }
                }
            }
        });

        // ==========================================
        // 4. HELPER WARNA BADGE STATUS
        // ==========================================
        function getStatusBadgeStyle(status) {
            switch(status) {
                case 'Aktif':
                    return 'background: #dcfce7; color: #15803d;';
                case 'Probation':
                    return 'background: #fef3c7; color: #b45309;';
                case 'Kontrak':
                    return 'background: #e0f2fe; color: #0369a1;';
                case 'Nonaktif':
                    return 'background: #fee2e2; color: #991b1b;';
                default:
                    return 'background: #f1f5f9; color: #475569;';
            }
        }

        // ==========================================
        // 5. GENERATE & PREVIEW ID KARYAWAN OTOMATIS
        // ==========================================
        async function initEmployeeAdd() {
            const inputDisplayId = document.getElementById('displayGeneratedEmpId');
            if (!inputDisplayId || !dbClient) return;

            let generatedEmpId = 'EMP-0001';
            const { data: lastEmp, error } = await dbClient
                .from('employees')
                .select('employee_id')
                .order('id', { ascending: false })
                .limit(1);

            if (!error && lastEmp && lastEmp.length > 0 && lastEmp[0].employee_id) {
                let parts = lastEmp[0].employee_id.split('-');
                if (parts.length > 1) {
                    let nextNumber = parseInt(parts[1], 10) + 1;
                    generatedEmpId = 'EMP-' + String(nextNumber).padStart(4, '0');
                }
            }

            inputDisplayId.value = generatedEmpId;
        }

        // ==========================================
        // 6. TAMBAH KARYAWAN BARU KE SUPABASE
        // ==========================================
        document.addEventListener('submit', async function(e) {
            if (e.target && e.target.id === 'formAddEmployee') {
                e.preventDefault();
                
                const displayIdElem = document.getElementById('displayGeneratedEmpId');
                const employeeIdToSave = displayIdElem ? displayIdElem.value.trim() : 'EMP-0001';

                const inputNik = document.getElementById('inputNik');
                const inputNama = document.getElementById('inputNama');
                const inputJenisKelamin = document.getElementById('inputJenisKelamin');
                const inputTempatLahir = document.getElementById('inputTempatLahir');
                const inputTanggalLahir = document.getElementById('inputTanggalLahir');
                const inputAgama = document.getElementById('inputAgama');
                const inputAlamat = document.getElementById('inputAlamat');
                const inputTelp = document.getElementById('inputTelp');
                const inputEmailPribadi = document.getElementById('inputEmailPribadi');
                
                const inputDaruratNama = document.getElementById('inputDaruratNama');
                const inputDaruratHubungan = document.getElementById('inputDaruratHubungan');
                const inputDaruratTelp = document.getElementById('inputDaruratTelp');

                const inputJenisKontrak = document.getElementById('inputJenisKontrak');
                const inputJoinDate = document.getElementById('inputJoinDate');
                const inputEndDate = document.getElementById('inputEndDate');
                const inputDivisi = document.getElementById('inputDivisi');
                const inputAtasan = document.getElementById('inputAtasan');
                const inputLokasi = document.getElementById('inputLokasi');
                const inputEmailPerusahaan = document.getElementById('inputEmailPerusahaan');

                const inputPendidikanTerakhir = document.getElementById('inputPendidikanTerakhir');
                const inputTahunMasuk = document.getElementById('inputTahunMasuk');
                const inputUniversitas = document.getElementById('inputUniversitas');
                const inputJurusan = document.getElementById('inputJurusan');
                const inputIpk = document.getElementById('inputIpk');

                const inputBankNama = document.getElementById('inputBankNama');
                const inputBankNo = document.getElementById('inputBankNo');
                const inputBankPemilik = document.getElementById('inputBankPemilik');
                const inputBpjs = document.getElementById('inputBpjs');
                const inputNpwp = document.getElementById('inputNpwp');
                const inputPtkp = document.getElementById('inputPtkp');

                if (inputNik && inputNik.value.length !== 16) {
                    alert('NIK wajib diisi tepat 16 digit angka.');
                    inputNik.focus();
                    return;
                }

                if (!dbClient) {
                    alert('Klien database belum terinisialisasi.');
                    return;
                }

                const payload = {
                    employee_id: employeeIdToSave,
                    nik: inputNik ? inputNik.value.trim() : null,
                    name: inputNama ? inputNama.value.trim() : null,
                    jenis_kelamin: inputJenisKelamin ? inputJenisKelamin.value : null,
                    tempat_lahir: inputTempatLahir ? inputTempatLahir.value.trim() : null,
                    tanggal_lahir: inputTanggalLahir && inputTanggalLahir.value ? inputTanggalLahir.value : null,
                    agama: inputAgama ? inputAgama.value : null,
                    alamat: inputAlamat ? inputAlamat.value.trim() : null,
                    telepon: inputTelp ? inputTelp.value.trim() : null,
                    email_pribadi: inputEmailPribadi ? inputEmailPribadi.value.trim() : null,
                    
                    kontak_darurat_nama: inputDaruratNama ? inputDaruratNama.value.trim() : null,
                    kontak_darurat_hubungan: inputDaruratHubungan ? inputDaruratHubungan.value : null,
                    kontak_darurat_telepon: inputDaruratTelp ? inputDaruratTelp.value.trim() : null,

                    jenis_kontrak: inputJenisKontrak ? inputJenisKontrak.value : null,
                    join_date: inputJoinDate && inputJoinDate.value ? inputJoinDate.value : null,
                    end_date: inputEndDate && inputEndDate.value ? inputEndDate.value : null,
                    department: inputDivisi ? inputDivisi.value : null,
                    atasan: inputAtasan ? inputAtasan.value.trim() : null,
                    lokasi: inputLokasi ? inputLokasi.value.trim() : null,
                    email: inputEmailPerusahaan ? inputEmailPerusahaan.value.trim() : null,

                    pendidikan_terakhir: inputPendidikanTerakhir ? inputPendidikanTerakhir.value : null,
                    tahun_masuk: inputTahunMasuk && inputTahunMasuk.value ? parseInt(inputTahunMasuk.value) : null,
                    universitas: inputUniversitas ? inputUniversitas.value.trim() : null,
                    jurusan: inputJurusan ? inputJurusan.value.trim() : null,
                    ipk: inputIpk && inputIpk.value !== '' ? parseFloat(inputIpk.value) : null,
                    position: inputJurusan && inputJurusan.value ? inputJurusan.value.trim() + ' Graduate' : 'Staff',

                    bank_nama: inputBankNama ? inputBankNama.value.trim() : null,
                    bank_no: inputBankNo ? inputBankNo.value.trim() : null,
                    bank_pemilik: inputBankPemilik ? inputBankPemilik.value.trim() : null,
                    bpjs: inputBpjs ? inputBpjs.value.trim() : null,
                    npwp: inputNpwp ? inputNpwp.value.trim() : null,
                    ptkp: inputPtkp ? inputPtkp.value : null,
                    status: 'Aktif'
                };

                const { error: insertError } = await dbClient
                    .from('employees')
                    .insert([payload]);

                if (insertError) {
                    alert('Gagal menyimpan data karyawan: ' + insertError.message);
                    return;
                }

                alert(`Karyawan baru berhasil ditambahkan dengan ID: ${employeeIdToSave}`);
                loadModule('employees');
            }
        });

        // ==========================================
        // 7. CORE HR: FETCH & PENCARIAN KARYAWAN
        // ==========================================
        async function fetchEmployeesFromSupabase() {
            const tbody = document.getElementById('employeeTableBody');
            if (!tbody) return;

            try {
                const { data, error } = await dbClient
                    .from('employees')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;
                allEmployeesCache = data || [];
            } catch (err) {
                console.warn('Gagal memuat dari Supabase:', err.message);
                allEmployeesCache = [];
            }

            renderEmployeeTable(allEmployeesCache);
            setupEmployeeSearchAndFilter();
        }

        function renderEmployeeTable(dataList) {
            const tbody = document.getElementById('employeeTableBody');
            if (!tbody) return;

            if (!dataList || dataList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="padding: 24px; text-align: center; color: #64748b;">Belum ada data karyawan.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            dataList.forEach(emp => {
                const empId = emp.employee_id || '-';
                const empName = emp.name || '-';
                const empNik = emp.nik || '-';
                const empDept = emp.department || '-';
                const empPos = emp.position || '-';
                const empStatus = emp.status || 'Aktif';

                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 14px 20px; font-weight: 600; color: #0369a1;">${empId}</td>
                        <td style="padding: 14px 20px; color: #334155;">
                            <div style="font-weight: 600; color: #1e293b;">${empName}</div>
                            <div style="font-size: 0.75rem; color: #64748b;">NIK: ${empNik}</div>
                        </td>
                        <td style="padding: 14px 20px; color: #64748b;">${empDept}</td>
                        <td style="padding: 14px 20px; color: #64748b;">${empPos}</td>
                        <td style="padding: 14px 20px;">
                            <span style="padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; ${getStatusBadgeStyle(empStatus)}">${empStatus}</span>
                        </td>
                        <td style="padding: 14px 20px; text-align: center;">
                            <button onclick="editEmployee('${emp.id}')" style="padding: 6px 12px; background: #e0f2fe; color: #0369a1; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem;" title="Edit Karyawan">
                                <i class="fa-solid fa-pen-to-square"></i> Edit
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function setupEmployeeSearchAndFilter() {
            const searchInput = document.getElementById('searchEmployeeInput');
            const filterSelect = document.getElementById('filterStatusSelect');

            const applyFilterAndSearch = () => {
                const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
                const selectedStatus = filterSelect ? filterSelect.value : '';

                let filtered = allEmployeesCache.filter(emp => {
                    const name = (emp.name || '').toLowerCase();
                    const nik = (emp.nik || '').toLowerCase();
                    const empId = (emp.employee_id || '').toLowerCase();
                    const status = emp.status || 'Aktif';

                    let matchSearch = true;
                    if (query.length > 0) {
                        if (query.length >= 3) {
                            matchSearch = name.includes(query) || nik.includes(query) || empId.includes(query);
                        }
                    }

                    let matchStatus = true;
                    if (selectedStatus !== '') {
                        matchStatus = (status === selectedStatus);
                    }

                    return matchSearch && matchStatus;
                });

                renderEmployeeTable(filtered);
            };

            if (searchInput) searchInput.addEventListener('input', applyFilterAndSearch);
            if (filterSelect) filterSelect.addEventListener('change', applyFilterAndSearch);
        }

        // ==========================================
        // 8. EDIT KARYAWAN
        // ==========================================
        function editEmployee(id) {
            sessionStorage.setItem('activeEditEmployeeId', id);
            loadModule('employee-edit');
        }

        async function initEmployeeEdit() {
            const editId = sessionStorage.getItem('activeEditEmployeeId');
            if (!editId) {
                loadModule('employees');
                return;
            }

            let empData = allEmployeesCache.find(e => String(e.id) === String(editId));
            if (!empData && dbClient) {
                const { data, error } = await dbClient.from('employees').select('*').eq('id', editId).single();
                if (!error && data) empData = data;
            }

            if (!empData) {
                alert('Data karyawan tidak ditemukan.');
                loadModule('employees');
                return;
            }

            document.getElementById('editEmployeeId').value = empData.id || '';
            document.getElementById('editNama').value = empData.name || '';
            document.getElementById('editNik').value = empData.nik || '';
            document.getElementById('editJenisKelamin').value = empData.jenis_kelamin || '';
            document.getElementById('editTempatLahir').value = empData.tempat_lahir || '';
            document.getElementById('editTanggalLahir').value = empData.tanggal_lahir || '';
            document.getElementById('editAgama').value = empData.agama || '';
            document.getElementById('editAlamat').value = empData.alamat || '';
            document.getElementById('editTelp').value = empData.telepon || '';
            document.getElementById('editEmailPribadi').value = empData.email_pribadi || '';
            
            document.getElementById('editDaruratNama').value = empData.kontak_darurat_nama || '';
            document.getElementById('editDaruratHubungan').value = empData.kontak_darurat_hubungan || '';
            document.getElementById('editDaruratTelp').value = empData.kontak_darurat_telepon || '';

            document.getElementById('editJenisKontrak').value = empData.jenis_kontrak || '';
            document.getElementById('editJoinDate').value = empData.join_date || '';
            document.getElementById('editStatus').value = empData.status || 'Aktif';
            document.getElementById('editDivisi').value = empData.department || '';
            document.getElementById('editAtasan').value = empData.atasan || '';
            document.getElementById('editLokasi').value = empData.lokasi || '';
            document.getElementById('editEmailPerusahaan').value = empData.email || '';

            document.getElementById('editPendidikanTerakhir').value = empData.pendidikan_terakhir || '';
            document.getElementById('editTahunMasuk').value = empData.tahun_masuk || '';
            document.getElementById('editUniversitas').value = empData.universitas || '';
            document.getElementById('editJurusan').value = empData.jurusan || '';
            document.getElementById('editIpk').value = empData.ipk ?? '';

            document.getElementById('editBankNama').value = empData.bank_nama || '';
            document.getElementById('editBankNo').value = empData.bank_no || '';
            document.getElementById('editBankPemilik').value = empData.bank_pemilik || '';
            document.getElementById('editBpjs').value = empData.bpjs || '';
            document.getElementById('editNpwp').value = empData.npwp || '';
            document.getElementById('editPtkp').value = empData.ptkp || '';

            const editEndDateContainer = document.getElementById('editEndDateContainer');
            const editEndDate = document.getElementById('editEndDate');
            if (empData.jenis_kontrak === 'Kontrak' || empData.jenis_kontrak === 'Probation') {
                if (editEndDateContainer) editEndDateContainer.style.display = 'grid';
                if (editEndDate) {
                    editEndDate.value = empData.end_date || '';
                    editEndDate.required = true;
                }
            }

        function formatTimeInput(timeStr) {
            if (!timeStr) return null;
            timeStr = timeStr.trim();
            if (/^\d{2}:\d{2}$/.test(timeStr)) {

            }
            return timeStr;
        }

        async function previewOvertimeCsv(event) {
            const file = event.target.files[0];
            if (!file) return;

            parsedOvertimeUploadData = [];
            const previewCard = document.getElementById('uploadPreviewCard');
            const previewBody = document.getElementById('previewOvertimeTableBody');
            const btnConfirm = document.getElementById('btnConfirmUpload');

            if (previewBody) {
                previewBody.innerHTML = `<tr><td colspan="5" style="padding: 12px; text-align: center; color: #64748b;">Memproses dan memvalidasi file baru...</td></tr>`;
            }
            if (previewCard) previewCard.style.display = 'block';
            if (btnConfirm) {
                btnConfirm.disabled = true;
                btnConfirm.style.background = '#94a3b8';
            }

            if (allEmployeesCache.length === 0 && dbClient) {
                const { data: empData } = await dbClient.from('employees').select('*');
                allEmployeesCache = empData || [];
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n').map(r => r.trim()).filter(r => r.length > 0);
                
                if (!previewBody) return;
                previewBody.innerHTML = '';
                let hasError = false;
                let seenRowsInFile = new Set();

                let startIndex = rows[0].toLowerCase().includes('employee_id') ? 1 : 0;

                for (let i = startIndex; i < rows.length; i++) {
                    const cols = rows[i].split(',').map(c => c.trim());
                    if (cols.length < 3) continue;

                    const [empId, dateStr, hoursStr, notesStr] = cols;
                    let statusHtml = '<span style="color: #16a34a; font-weight: 600;">Valid</span>';
                    let isValid = true;

                    const rowKey = `${empId}_${dateStr}`;

                    let foundEmp = allEmployeesCache.find(e => e.employee_id === empId);
                    if (!foundEmp) {
                        statusHtml = '<span style="color: #dc2626; font-weight: 600;">Error: ID Karyawan tidak ditemukan</span>';
                        isValid = false;
                        hasError = true;
                    } 
                    else if (isNaN(hoursStr) || parseFloat(hoursStr) <= 0) {
                        statusHtml = '<span style="color: #dc2626; font-weight: 600;">Error: Jam lembur tidak valid</span>';
                        isValid = false;
                        hasError = true;
                    }
                    else if (seenRowsInFile.has(rowKey)) {
                        statusHtml = '<span style="color: #dc2626; font-weight: 600;">Error: Duplikasi data di tanggal yang sama dalam file</span>';
                        isValid = false;
                        hasError = true;
                    } else {
                        seenRowsInFile.add(rowKey);
                    }

                    parsedOvertimeUploadData.push({
                        employee_id: empId,
                        date: dateStr,
                        hours: parseFloat(hoursStr),
                        notes: notesStr || '',
                        isValid: isValid
                    });

                    previewBody.innerHTML += `
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 8px 14px;">${empId}</td>
                            <td style="padding: 8px 14px;">${dateStr}</td>
                            <td style="padding: 8px 14px;">${hoursStr}</td>
                            <td style="padding: 8px 14px;">${notesStr || '-'}</td>
                            <td style="padding: 8px 14px;">${statusHtml}</td>
                        </tr>
                    `;
                }

                if (parsedOvertimeUploadData.length === 0) {
                    previewBody.innerHTML = `<tr><td colspan="5" style="padding: 12px; text-align: center; color: #dc2626;">File CSV kosong atau format tidak sesuai.</td></tr>`;
                    hasError = true;
                }

                if (hasError) {
                    btnConfirm.disabled = true;
                    btnConfirm.style.background = '#94a3b8';
                    btnConfirm.title = 'Perbaiki data yang error pada file sebelum mengonfirmasi';
                } else {
                    btnConfirm.disabled = false;
                    btnConfirm.style.background = '#059669';
                }
            };
            reader.readAsText(file);
        }

        async function fetchLeaveBalances() {
            const tbody = document.getElementById('leaveBalanceTableBody');

            tbody.innerHTML = `<tr><td colspan="6" style="padding: 24px; text-align: center; color: #64748b;">Memuat saldo cuti pegawai...</td></tr>`;

            const currentYear = new Date().getFullYear();

            const { data, error } = await dbClient
                .from('employees')
                .select(`
                    employee_id,
                    name,
                    department,
                    leave_balances (id, year, total_quota, used_quota, remaining_quota)
                `)
                .eq('status', 'Aktif');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="padding: 24px; text-align: center; color: #ef4444;">Gagal memuat saldo cuti: ${error.message}</td></tr>`;
                return;
            }

                tbody.innerHTML = `<tr><td colspan="6" style="padding: 24px; text-align: center; color: #64748b;">Belum ada data karyawan aktif.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            for (const emp of data) {
                let balance = (emp.leave_balances || []).find(b => b.year === currentYear);
                
                let total = balance ? balance.total_quota : 12;
                let used = balance ? balance.used_quota : 0;
                let remaining = total - used;

                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 14px 20px;">
                            <div style="font-weight: 600; color: #1e293b;">${emp.name}</div>
                            <div style="font-size: 0.75rem; font-weight: 600; color: #0369a1; margin-top: 2px;">${emp.employee_id}</div>
                        </td>
                        <td style="padding: 14px 20px; color: #334155;">${emp.department || '-'}</td>
                        <td style="padding: 14px 20px; color: #334155; font-weight: 600;">${currentYear}</td>
                        <td style="padding: 14px 20px; color: #334155;">${total} Hari</td>
                        <td style="padding: 14px 20px; color: #b45309; font-weight: 600;">${used} Hari</td>
                        <td style="padding: 14px 20px; color: #15803d; font-weight: 700;">${remaining} Hari</td>
                    </tr>
                `;
            }
        }

        async function initLeaveAddModule() {
            const selectEmp = document.getElementById('selectLeaveEmployee');
            if (!selectEmp) return;

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputLeaveStartDate').value = today;
            document.getElementById('inputLeaveEndDate').value = today;

            if (allEmployeesCache.length === 0 && dbClient) {
                const { data } = await dbClient.from('employees').select('*').eq('status', 'Aktif');
                allEmployeesCache = data || [];
            }

            selectEmp.innerHTML = `<option value="" disabled selected>-- Pilih Karyawan --</option>`;
            const activeEmps = allEmployeesCache.filter(e => e.status === 'Aktif');
            
            activeEmps.forEach(emp => {
                selectEmp.innerHTML += `<option value="${emp.employee_id}">${emp.employee_id} - ${emp.name} (${emp.department || '-'})</option>`;
            });
        }

        async function updateEmployeeLeaveBalanceInfo() {
            const selectEmp = document.getElementById('selectLeaveEmployee');
            const infoDiv = document.getElementById('leaveBalanceInfoDisplay');
            if (!selectEmp || !infoDiv || !dbClient) return;

            const empId = selectEmp.value;
            if (!empId) {
                infoDiv.textContent = '';
                return;
            }

            const currentYear = new Date().getFullYear();
            const { data: balanceData, error } = await dbClient
                .from('leave_balances')
                .select('*')
                .eq('employee_id', empId)
                .eq('year', currentYear)
                .single();

            let total = 12;
            let used = 0;
            if (!error && balanceData) {
                total = balanceData.total_quota;
                used = balanceData.used_quota;
            }
            let remaining = total - used;

            infoDiv.textContent = `Sisa Saldo Cuti Tahunan (${currentYear}): ${remaining} Hari (Total Hak: ${total}, Terpakai: ${used})`;
        }

        async function submitLeaveForm(event) {
            event.preventDefault();

            const empId = document.getElementById('selectLeaveEmployee').value;
            const leaveType = document.getElementById('selectLeaveType').value;
            const startDate = document.getElementById('inputLeaveStartDate').value;
            const endDate = document.getElementById('inputLeaveEndDate').value;
            const totalDays = parseInt(document.getElementById('inputLeaveTotalDays').value);
            const reason = document.getElementById('inputLeaveReason').value.trim();

            if (!empId) {
                alert('Silakan pilih karyawan terlebih dahulu.');
                return;
            }

            if (new Date(endDate) < new Date(startDate)) {
                alert('Validasi Gagal: Tanggal selesai tidak boleh lebih awal dari tanggal mulai!');
                return;
            }

            if (isNaN(totalDays) || totalDays <= 0) {
                alert('Jumlah hari harus berupa angka yang valid.');
                return;
            }

            const { error } = await dbClient.from('leaves').insert([{
                employee_id: empId,
                leave_type: leaveType,
                start_date: startDate,
                end_date: endDate,
                total_days: totalDays,
                reason: reason,
                status: 'Pending'
            }]);

            if (error) {
                alert('Gagal menyimpan pengajuan cuti: ' + error.message);
                return;
            }

            alert('Pengajuan cuti/izin berhasil disimpan!');
            loadModule('leave');
        }

        async function processLeaveApproval(leaveId, empId, leaveType, totalDays, newStatus) {
            const currentYear = new Date().getFullYear();

            if (newStatus === 'Approved' && leaveType === 'Cuti Tahunan') {
                let { data: balanceData, error: balErr } = await dbClient
                    .from('leave_balances')
                    .select('*')
                    .eq('employee_id', empId)
                    .eq('year', currentYear)
                    .single();

                if (balErr || !balanceData) {
                    const { data: newBal, error: insErr } = await dbClient
                        .from('leave_balances')
                        .insert([{ employee_id: empId, year: currentYear, total_quota: 12, used_quota: 0 }])
                        .select()
                        .single();
                    
                    if (insErr) {
                        alert('Gagal menginisialisasi saldo cuti karyawan: ' + insErr.message);
                        return;
                    }
                    balanceData = newBal;
                }

                let remaining = balanceData.total_quota - balanceData.used_quota;
                if (totalDays > remaining) {
                    alert(`Persetujuan ditolak: Sisa cuti tahunan pegawai hanya tersisa ${remaining} hari, sedangkan pengajuan berjumlah ${totalDays} hari.`);
                    return;
                }

                const newUsedQuota = balanceData.used_quota + totalDays;
                const { error: updateBalErr } = await dbClient
                    .from('leave_balances')
                    .update({ used_quota: newUsedQuota })
                    .eq('employee_id', empId)
                    .eq('year', currentYear);

                if (updateBalErr) {
                    alert('Gagal memotong saldo cuti: ' + updateBalErr.message);
                    return;
                }
            }

            const { error: updateLeaveErr } = await dbClient
                .from('leaves')
                .update({ status: newStatus, approved_by: 'HR Administrator' })
                .eq('id', leaveId);

            if (updateLeaveErr) {
                alert('Gagal memperbarui status pengajuan: ' + updateLeaveErr.message);
                return;
            }

            alert(`Pengajuan cuti berhasil di-${newStatus === 'Approved' ? 'setujui' : 'tolak'}!`);
            initLeaveModule();
        }

        // Fungsi fallback/jembatan pengaman untuk mencegah error ReferenceError jika cache memanggil fungsi lama
        function openLeaveRequestModal() {
            loadModule('leave-add');
        }

        // ==========================================
        // 12. DASHBOARD & ORGANISASI
        // ==========================================
        async function initDashboard() {
            const statEmp = document.getElementById('statTotalEmployees');
            if (statEmp) {
                try {
                    const { count, error } = await dbClient.from('employees').select('*', { count: 'exact', head: true });
                    if (!error && count !== null) statEmp.textContent = count;
                } catch (e) {
                    statEmp.textContent = '0';
                }
            }

            const dashTableBody = document.getElementById('dashboardEmployeeTableBody');
            if (dashTableBody) {
                try {
                    const { data } = await dbClient.from('employees').select('*').order('id', { ascending: false }).limit(5);
                    if (data && data.length > 0) {
                        dashTableBody.innerHTML = '';
                        data.forEach(emp => {
                            dashTableBody.innerHTML += `
                                <tr style="border-bottom: 1px solid #f1f5f9;">
                                    <td style="padding: 12px 16px; font-weight: 600; color: #1e293b;">${emp.name || '-'}</td>
                                    <td style="padding: 12px 16px; color: #475569;">${emp.department || '-'}</td>
                                    <td style="padding: 12px 16px; color: #475569;">${emp.position || '-'}</td>
                                    <td style="padding: 12px 16px;">
                                        <span style="padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; ${getStatusBadgeStyle(emp.status)}">${emp.status || 'Aktif'}</span>
                                    </td>
                                </tr>
                            `;
                        });
                    }
                } catch (e) {
                    dashTableBody.innerHTML = `<tr><td colspan="4" style="padding: 16px; text-align: center; color: #64748b;">Belum ada data.</td></tr>`;
                }
            }
        }

        async function fetchDepartmentsFromSupabase() {
            const tbody = document.getElementById('departmentTableBody');
            if (!tbody || !dbClient) return;

            const { data, error } = await dbClient.from('departments').select('*').order('id', { ascending: true });
            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="padding: 24px; text-align: center; color: #64748b;">Belum ada data departemen.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(dept => {
                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 14px 20px; font-weight: 600; color: #1e293b;">${dept.kode}</td>
                        <td style="padding: 14px 20px; color: #334155;">${dept.nama}</td>
                        <td style="padding: 14px 20px; color: #64748b;">${dept.hod || '-'}</td>
                        <td style="padding: 14px 20px;">
                            <span style="padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; ${getStatusBadgeStyle(dept.status)}">${dept.status}</span>
                        </td>
                    </tr>
                `;
            });
        }

        async function initOrganizationAdd() {
            const inputKodeDept = document.getElementById('inputKodeDept');
            if (!inputKodeDept || !dbClient) return;

            let generatedCode = 'DEP-001';
            const { data } = await dbClient.from('departments').select('kode').order('id', { ascending: false }).limit(1);
            if (data && data.length > 0) {
                let parts = data[0].kode.split('-');
                let num = parts.length > 1 ? parseInt(parts[1], 10) : 0;
                if (!isNaN(num)) generatedCode = 'DEP-' + String(num + 1).padStart(3, '0');
            }
            inputKodeDept.value = generatedCode;

            const formAddDept = document.getElementById('formAddDepartment');
            if (formAddDept) {
                formAddDept.onsubmit = async function(e) {
                    e.preventDefault();
                    const namaVal = document.getElementById('inputNamaDept').value.trim();
                    const hodVal = document.getElementById('inputHodDept').value.trim();
                    const statusVal = document.getElementById('inputStatusDept').value;

                    if (!namaVal) return alert('Nama departemen wajib diisi.');

                    const { error: insertError } = await dbClient.from('departments').insert([{ kode: generatedCode, nama: namaVal, hod: hodVal || null, status: statusVal }]);
                    if (insertError) {
                        alert('Gagal menyimpan: ' + insertError.message);
                        return;
                    }

                    alert(`Departemen ${namaVal} (${generatedCode}) berhasil disimpan!`);
                    loadModule('organization');
                };
            }
        }
    </script>
