<div style="display: flex; width: 100vw; height: 100vh; align-items: center; justify-content: center; background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%); position: fixed; top: 0; left: 0; z-index: 9999;">
    <div style="background: #ffffff; width: 100%; max-width: 440px; padding: 40px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);">
        <div style="text-align: center; margin-bottom: 28px;">
            <i class="fa-solid fa-users-gear" style="font-size: 2.5rem; color: #4f46e5; margin-bottom: 12px;"></i>
            <h2 style="font-size: 1.5rem; font-weight: 700; color: #1e293b;">HRIS Pro Admin</h2>
            <p style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">Enterprise Human Resource Information System</p>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #1e293b;">Email / Username</label>
                <input type="text" style="width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; outline: none;" value="admin@hrispro.com" required>
            </div>
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #1e293b;">Password</label>
                <input type="password" style="width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; outline: none;" value="password123" required>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
                <label style="color: #64748b;"><input type="checkbox" checked style="margin-right: 6px;"> Remember Me</label>
                <a href="#" onclick="alert('Simulasi pemulihan password dikirim ke email terdaftar.')" style="color: #4f46e5; text-decoration: none; font-weight: 500;">Forgot Password?</a>
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background-color: #4f46e5; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Sign In to Dashboard</button>
        </form>
    </div>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault();
        checkAuth(true); // Masuk ke dashboard utama
    }
</script>
