<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Rekapitulasi Kehadiran</h1>
            <p class="text-sm text-gray-500">Pantau jam masuk, pulang, lembur, dan status kehadiran harian pegawai.</p>
        </div>
        <div class="flex items-center gap-3">
            <label class="text-sm font-medium text-gray-600">Pilih Tanggal:</label>
            <input type="date" id="filterAttendanceDate" value="2026-09-15" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
    </div>

    <!-- Tabel Data Kehadiran -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-100">
                        <th class="py-3 px-4 font-semibold">ID & Nama Karyawan</th>
                        <th class="py-3 px-4 font-semibold">Departemen</th>
                        <th class="py-3 px-4 font-semibold">Jam Masuk</th>
                        <th class="py-3 px-4 font-semibold">Jam Pulang</th>
                        <th class="py-3 px-4 font-semibold">Status</th>
                        <th class="py-3 px-4 font-semibold">Lembur</th>
                        <th class="py-3 px-4 font-semibold text-center">Aksi (HR Override)</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                    <!-- Data akan dirender otomatis via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>
